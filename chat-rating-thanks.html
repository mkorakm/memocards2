<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemoCards — Спасибо за оценку</title>
  <script>(function(){try{var q=new URLSearchParams(location.search).get('theme');var t=q||localStorage.getItem('memocards_theme');if(t&&t!=='rose'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="header__inner container">
      <div class="header__brand">
        <div class="header__logo">M</div>
        <div class="header__title">MemoCards</div>
      </div>
      <div class="header__actions">
        <button class="icon-btn" type="button" data-action="cycle-theme" aria-label="Сменить цветовую тему" title="Сменить тему">🎨</button>
        <a href="profile.html" class="header__user" aria-label="Профиль" data-user-initial>Г</a>
      </div>
    </div>
  </header>

  <main class="content container">
    <section class="state">
      <div class="state__icon">★</div>
      <h1 class="state__title">Спасибо за оценку!</h1>
      <p class="state__text">Ваш отзыв отправлен. Мы используем его, чтобы улучшать работу поддержки MemoCards.</p>
      <div class="state__actions">
        <a class="btn btn--block" href="support.html">В поддержку</a>
        <a class="btn btn--ghost btn--block" href="index.html">На главную</a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav__inner container">
      <a href="index.html" class="bottom-nav__item"><span class="bottom-nav__icon">🏠</span>Главная</a>
      <a href="decks.html" class="bottom-nav__item"><span class="bottom-nav__icon">📚</span>Колоды</a>
      <a href="competitions.html" class="bottom-nav__item"><span class="bottom-nav__icon">🏆</span>Соревнования</a>
      <a href="profile.html" class="bottom-nav__item"><span class="bottom-nav__icon">👤</span>Профиль</a>
    </div>
  </nav>

  <script src="js/main.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
